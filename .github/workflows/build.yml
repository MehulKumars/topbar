name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build\TopBar.exe dist\
          Compress-Archive -Path dist\* -DestinationPath TopBar-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TopBar-win-x64
          path: |
            build/TopBar.exe
            TopBar-win-x64.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME build\TopBar.exe TopBar-win-x64.zip --title "TopBar $env:GITHUB_REF_NAME" --generate-notes --prerelease
